name: Auto-update sitemap and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Generate sitemap from published HTML files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re
          import xml.etree.ElementTree as ET

          base = "https://nathan-brenner.github.io/"
          ns = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", ns)

          if not Path("index.html").is_file():
              raise SystemExit("index.html is missing from the repository root")

          # Only clean HTML filenames become URLs. Excludes backup copies such as
          # 'index (3).html', plus custom error pages and hidden files.
          slug = re.compile(r"[a-z0-9]+(?:-[a-z0-9]+)*")
          pages = [Path("index.html")]
          for page in sorted(Path(".").rglob("*.html")):
              parts = page.parts
              if page.name in {"index.html", "404.html"}:
                  continue
              if any(not slug.fullmatch(part) for part in parts[:-1]):
                  continue
              if not page.name.endswith(".html") or not slug.fullmatch(page.stem):
                  continue
              pages.append(page)

          sitemap = ET.Element(f"{{{ns}}}urlset")
          for page in pages:
              node = ET.SubElement(sitemap, f"{{{ns}}}url")
              loc = ET.SubElement(node, f"{{{ns}}}loc")
              loc.text = base if page == Path("index.html") else base + quote(page.as_posix(), safe="/")

          ET.indent(sitemap, space="  ")
          Path("sitemap.xml").write_bytes(
              ET.tostring(sitemap, encoding="utf-8", xml_declaration=True) + b"\n"
          )
          print(f"Sitemap generated with {len(pages)} page(s)")
          PY

      - name: Save updated sitemap in GitHub
        shell: bash
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Automatically update sitemap.xml"
            git push
          else
            echo "sitemap.xml is already current"
          fi

      - name: Prepare published files
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='index (*).html' ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website and sitemap
        id: deployment
        uses: actions/deploy-pages@v4
